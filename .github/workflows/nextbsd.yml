name: NextBSD

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
    paths:
      - '**.py'
      - '.github/workflows/nextbsd.yml'
      - '.github/workflows/testrun.yml'



concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Coverage tracks nextbsd-builder (ALL_RELEASES = continuous,
# continuous-aarch64, continuous-desktop, continuous-desktop-aarch64).
# NextBSD publishes no versioned releases: upstream refreshes two rolling
# prerelease tags, continuous-server (release `continuous` here) and
# continuous-desktop, with live ISOs only, and each builder release tag
# freezes one installed snapshot (nextbsd-builder v2.0.4 on, installed from
# the ISO by upstream's own installer onto ZFS). The Desktop variant is
# tested here too, like ghostbsd's desktop releases.
#
# The confs' VM_SYNC_METHODS is rsync,scp,nfs,tar. No sshfs leg: the NEXTBSD
# kernel is built NO_MODULES and the image ships no kldload, so fusefs cannot
# be loaded and there is no /dev/fuse.
jobs:
  test:
    if: >-
      ${{ github.event_name != 'push'
          || (
               ( !contains(github.event.head_commit.message, '[testos=')
                 || contains(github.event.head_commit.message, '[testos=nextbsd]') )
            && ( !contains(github.event.head_commit.message, '[testhost=')
                 || contains(github.event.head_commit.message, '[testhost=linux') )
             ) }}
    strategy:
      fail-fast: false
      matrix:
        release: ["continuous", "continuous-desktop"]
        arch: ["", "aarch64"]
        runs: ["ubuntu-26.04"]
        sync: ["scp", "rsync", "nfs", "tar"]


    uses: ./.github/workflows/testrun.yml
    secrets: inherit
    with:
      runs: ${{ matrix.runs }}
      os: nextbsd
      release: ${{ matrix.release }}
      arch: ${{ matrix.arch }}
      sync: ${{ matrix.sync }}
